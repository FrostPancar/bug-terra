<!DOCTYPE html><html><head><meta charset="utf-8"><title>Bugs</title>
<style>
body{background:#4a4f55;margin:0;padding:20px 12px;font:12px ui-monospace,Menlo,monospace;color:#e8e6e2}
h2{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#a9adb3;
   margin:14px 0 6px;text-align:center;font-weight:500}
.row{display:flex;flex-wrap:wrap;justify-content:center}
figure{width:172px;margin:0;text-align:center;padding:4px 0}
canvas{width:156px;height:156px}
figcaption{margin-top:0;letter-spacing:.06em;text-transform:uppercase;font-size:10px}
small{display:block;color:#a9adb3;font-size:9px}
</style></head><body><script type="module">
import { ARCHETYPES, genomeFromArchetype, seededPopulation } from './src/core/archetypes.js';
import { normalizeGenome } from './src/core/genes.js';
import { makeRng } from './src/core/rng.js';
import { drawBug, HORN_TYPES, WING_TYPES, EYE_FILLS, CROWN_MARKS, MANDIBLE_TYPES } from './src/render/bugArt.js';

function card(g, title, sub) {
  const f = document.createElement('figure');
  const c = document.createElement('canvas');
  c.width = 312; c.height = 312;
  const ctx = c.getContext('2d');
  ctx.translate(156, 156);
  drawBug(ctx, g, { phase: 0.15, state: 'walk', ppu: 58 });
  const cap = document.createElement('figcaption'); cap.textContent = title;
  const s = document.createElement('small'); s.textContent = sub || '';
  f.append(c, cap, s); return f;
}
function section(label, nodes) {
  const h = document.createElement('h2'); h.textContent = label;
  const r = document.createElement('div'); r.className = 'row';
  nodes.forEach(n => r.appendChild(n));
  document.body.append(h, r);
}

// a neutral body so the part under test is the only thing changing
const BASE = normalizeGenome({
  body_length: 0.42, body_width: 0.60, body_mass: 0.45,
  head_width: 0.48, head_length: 0.48, thorax_width: 0.43, thorax_length: 0.43,
  abdomen_width: 0.41, abdomen_length: 0.41, abdomen_taper: 0.25, leg_count: 6, leg_length: 0.55,
  leg_thickness: 0.55, leg_spread: 0.5,
  wing_count: 0, wing_area: 0, mandible_size: 0.62, horn_size: 0.80,
  eye_count: 2, eye_size: 0.80, antenna_length: 0.25,
  hue: 0.015, saturation: 0.55, lightness: 0.55, pattern_leg: 0.8,
  iridescence: 0.1, setae: 0,
});

section('horn kinds', HORN_TYPES.map((n, i) =>
  card({ ...BASE, horn_type: i }, n)));

// One silhouette, three fill treatments — the shape is the same in all three.
section('eye fills', EYE_FILLS.map((n, i) =>
  card({ ...BASE, eye_type: i, horn_size: 0.1, eye_size: 0.95 }, n)));

section('crown marks', CROWN_MARKS.map((n, i) =>
  card({ ...BASE, crown_mark_style: i, horn_size: 0.1, eye_size: 0.95 }, n)));

section('horn serration', [0, 1, 2].flatMap((sr) =>
  HORN_TYPES.map((n, i) => card({ ...BASE, horn_type: i, horn_serration: sr }, `${n} ${sr}SR`))));
section('horn patterns', ['flat', 'gradient', 'dots', 'oval'].map((n, i) =>
  card({ ...BASE, horn_type: 2, horn_serration: 2, pattern_horn: (i + 0.5) / 4, pattern_contrast: 0.85 }, n)));
// The jaw gene is separate — the same four states, chosen independently.
section('jaw patterns', ['flat', 'gradient', 'dots', 'oval'].map((n, i) =>
  card({ ...BASE, horn_size: 0.1, mandible_size: 0.9, pattern_mandible: (i + 0.5) / 4, pattern_contrast: 0.85 }, n)));
section('mandible kinds', MANDIBLE_TYPES.map((n, i) =>
  card({ ...BASE, mandible_type: i, horn_size: 0.1, mandible_size: 0.9 }, n)));
// The chelicerae fang is a serration level now, not a kind of its own.
section('chelicerae serration', [0.1, 0.5, 0.9].map((v, i) =>
  card({ ...BASE, mandible_type: 2, horn_size: 0.1, mandible_size: 0.9, mandible_serration: v }, `chelicerae ${i}SR`)));

section('wing kinds', WING_TYPES.map((n, i) =>
  card({ ...BASE, wing_type: i, wing_count: 4, wing_area: 0.8, horn_size: 0.1 }, n)));

const rng = makeRng(11);
section('the archetypes', ARCHETYPES.map(a => {
  const g = genomeFromArchetype(a, rng);
  return card(g, a.name, `${HORN_TYPES[g.horn_type]} · ${EYE_FILLS[g.eye_type]} · ${MANDIBLE_TYPES[g.mandible_type]}`);
}));

section('wild', seededPopulation(8, makeRng(2026), { wildcards: 1 }).map((g, i) =>
  card(g, 'Wild ' + (i + 1), `${HORN_TYPES[g.horn_type]} · ${WING_TYPES[g.wing_type]}`)));

document.title = 'ready';
</script></body></html>
