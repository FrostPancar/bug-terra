<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0b09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Terrarium — procedural bug genetics prototype</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230d0b09'/><g stroke='%23c9a227' stroke-width='2' stroke-linecap='round'><path d='M9 10 4 6M9 16 3 16M9 22 4 26M23 10 28 6M23 16 29 16M23 22 28 26'/></g><ellipse cx='16' cy='16' rx='6' ry='9' fill='%23c9a227'/><circle cx='16' cy='8' r='3.5' fill='%23e0bd4a'/></svg>">
<style>
  :root {
    --bg: #0d0b09; --panel: #16130f; --line: #2a241c;
    --ink: #ece3d4; --muted: #9a8f7d; --accent: #c9a227;
    --sheet: 46vh;              /* expanded bottom-sheet height on phones */
    --sheet-now: 14px;          /* how much panel is below the dock, per layout */
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    overscroll-behavior: none;           /* kill pull-to-refresh + rubber band */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    font: 14px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    height: 100vh;                        /* fallback for older Safari */
    height: -webkit-fill-available;
    height: 100dvh;                       /* the one that actually behaves on iOS */
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 330px;
    grid-template-rows: 100%;
  }

  /* ------------------------------------------------------------ stage -- */
  /* #stage owns the padding (safe areas + sheet reservation); #canvasHost is
     the content box Phaser measures. Phaser reads the parent's clientHeight,
     which INCLUDES padding — so the canvas must mount one level in, or it
     would happily draw underneath the bottom sheet. */
  #stage {
    position: relative;
    display: grid;
    grid-template-rows: 100%;
    overflow: hidden;
    min-width: 0; min-height: 0;
    touch-action: none;                   /* no pan/zoom stealing taps */
    padding: var(--safe-t) 0 0 var(--safe-l);
  }
  #canvasHost {
    display: grid; place-items: center;
    min-width: 0; min-height: 0; overflow: hidden;
  }
  #canvasHost canvas { display: block; max-width: 100%; max-height: 100%; }

  /* ------------------------------------------------------------ panel -- */
  aside {
    grid-column: 2;
    border-left: 1px solid var(--line);
    /* translucent on purpose — the glass buttons refract whatever shows
       through, so an opaque panel would leave them with nothing to bend */
    background: rgba(22, 19, 15, .88);
    -webkit-backdrop-filter: blur(18px) saturate(1.15);
    backdrop-filter: blur(18px) saturate(1.15);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: calc(14px + var(--safe-t)) 14px calc(40px + var(--safe-b));
    min-height: 0;
  }

  h1 { font-size: 15px; letter-spacing: .06em; text-transform: uppercase;
       margin: 0 0 4px; color: var(--accent); }
  h3 { font-size: 14px; margin: 0 0 2px; }
  h4 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
       color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 11px; }
  .dead { color: #ff6b57; font-size: 11px; }

  .block { border: 1px solid var(--line); border-radius: 6px;
           padding: 10px; margin-bottom: 12px; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
  .stat-grid div { display: flex; justify-content: space-between; gap: 6px; }
  .stat-grid span:first-child { color: var(--muted); }
  #sun { width: 100%; height: 4px; border-radius: 2px; margin-top: 8px;
         background: #333; transition: background .6s linear; }

  /* --------------------------------------------------------- controls -- */
  button, select, input[type=number] {
    background: #221d16; color: var(--ink); border: 1px solid var(--line);
    border-radius: 5px; padding: 9px 11px; font: inherit; cursor: pointer;
    min-height: 40px;                     /* comfortable touch target */
    touch-action: manipulation;           /* no 300ms delay, no double-tap zoom */
    -webkit-appearance: none; appearance: none;
  }
  select {
    padding-right: 26px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  button:active { border-color: var(--accent); background: #2c251a; }
  @media (hover: hover) { button:hover { border-color: var(--accent); } }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .btns button { flex: 1 1 auto; white-space: nowrap; }

  /* ------------------------------------------------- circular glass dial -- */
  /* The dial floats OVER the terrarium rather than sitting on the panel.
     backdrop-filter refracts whatever is painted behind the element, so on an
     opaque panel there is nothing to bend — over the live scene there is. */
  #dock {
    position: absolute; z-index: 5;
    left: 50%; transform: translateX(-50%);
    bottom: calc(var(--sheet-now) + 16px);
    display: grid;
    grid-template-columns: repeat(4, auto);
    gap: 16px;
    justify-items: center;
    padding: 0;
    transition: bottom .28s cubic-bezier(.4, 0, .2, 1);
    pointer-events: none;          /* only the buttons are hit targets */
  }
  #dock .glass-btn { pointer-events: auto; }
  .glass-btn {
    --d: 58px;
    width: var(--d); height: var(--d);
    min-height: var(--d);
    padding: 0;
    display: grid; place-items: center; gap: 0;
    border-radius: 50%;                  /* the lens is a circle */
    position: relative; isolation: isolate;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(236,227,212,.085); /* the tint the lens carries */
    color: var(--ink);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.34),   /* top rim catch */
      inset 0 -1px 0 rgba(0,0,0,.30),        /* bottom shade */
      inset 0 0 18px rgba(255,255,255,.06),  /* lifts the dome out of the dark */
      0 4px 16px rgba(0,0,0,.45);            /* float off the scene */
    transition: transform .16s cubic-bezier(.4,0,.2,1),
                box-shadow .16s ease, background .16s ease;
  }
  /* the crisp layer: icon + label ride on top of the refracted backdrop */
  .glass-btn svg {
    width: 21px; height: 21px;
    fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.55));
    pointer-events: none;
  }
  .glass-btn span {
    position: absolute; top: calc(100% + 5px); left: 50%;
    transform: translateX(-50%);
    font-size: 10px; letter-spacing: .02em;
    color: var(--ink); white-space: nowrap; pointer-events: none;
    /* the labels sit on the live scene, so they need their own contrast */
    text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.7);
  }

  .glass-btn:active {
    transform: scale(.93);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.20),
      inset 0 -1px 0 rgba(0,0,0,.34),
      0 2px 7px rgba(0,0,0,.42);
  }
  @media (hover: hover) {
    .glass-btn:hover {
      background: rgba(236,227,212,.085);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.38),
        inset 0 -1px 0 rgba(0,0,0,.30),
        0 6px 18px rgba(0,0,0,.42);
    }
  }
  .glass-btn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 3px;
  }
  /* toggled state — Pause reads as engaged */
  .glass-btn[aria-pressed="true"] {
    background: rgba(201,162,39,.20);
    border-color: rgba(201,162,39,.55);
    color: #f4dd93;
  }
  /* Safari/Firefox can't bend the live page (backdrop-filter: url() is
     Chromium-only). They still frost + tint + edge-light, so it reads as
     glass — lean on the rim a little harder there to compensate. */
  .glass-btn[data-glass="frost"] {
    border-color: rgba(255,255,255,.22);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.38),
      inset 0 -1px 0 rgba(0,0,0,.32),
      inset 0 0 14px rgba(255,255,255,.07),
      0 4px 14px rgba(0,0,0,.38);
  }

  .ffn-row { justify-content: flex-start; gap: 8px; }
  .ffn-row #ffN { margin-left: auto; }

  @media (prefers-reduced-motion: reduce) {
    .glass-btn, #dock { transition: none; }
  }

  label { display: flex; align-items: center; justify-content: space-between;
          gap: 10px; margin: 10px 0 0; color: var(--muted); font-size: 12px; }
  label > b { color: var(--ink); min-width: 58px; text-align: right; }
  input[type=range] {
    flex: 1; min-width: 0; accent-color: var(--accent);
    height: 44px;                         /* full touch target, thin visual track */
    margin: 0; padding: 0;
    touch-action: manipulation; background: transparent;
    -webkit-appearance: none; appearance: none;
  }
  /* Safari/Chrome need the track and thumb drawn explicitly. The track is the
     FULL height of the thumb with the visible line painted as a centred
     background — a 4px track clips the thumb's bottom half into a dome. */
  input[type=range]::-webkit-slider-runnable-track {
    height: 24px; border: none;
    background: linear-gradient(#3a3228, #3a3228) center / 100% 4px no-repeat;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); border: none; margin-top: 1px;
  }
  input[type=range]::-moz-range-track {
    height: 4px; border-radius: 2px; background: #3a3228; border: none;
  }
  input[type=range]::-moz-range-thumb {
    width: 22px; height: 22px; border: none; border-radius: 50%; background: var(--accent);
  }
  @media (pointer: coarse) {
    input[type=range]::-webkit-slider-thumb { width: 24px; height: 24px; margin-top: 0; }
    input[type=range]::-moz-range-thumb { width: 24px; height: 24px; }
  }
  #ffN { width: 64px; flex: 0 0 auto; text-align: center; }

  .row { display: grid; grid-template-columns: 74px minmax(0,1fr) 46px;
         align-items: center; gap: 6px; margin: 3px 0; }
  .row .k { color: var(--muted); font-size: 11px;
            overflow: hidden; text-overflow: ellipsis; }
  .row .v { text-align: right; font-size: 11px; }
  .track { height: 7px; background: #221d16; border-radius: 4px; overflow: hidden; }
  .track i { display: block; height: 100%;
             background: linear-gradient(90deg, #7a6a2a, var(--accent)); }

  .genes { display: flex; flex-wrap: wrap; gap: 3px; }
  .gene { font-size: 10px; background: #1e1a14; border: 1px solid var(--line);
          border-radius: 3px; padding: 3px 5px; }
  .gene b { color: var(--muted); font-weight: 400; margin-right: 5px; }

  /* --------------------------------------------------- sheet handle ---- */
  #handle { display: none; }

  /* ====================================================================
     NARROW / TOUCH — panel becomes a bottom sheet over a full-bleed stage
     ==================================================================== */
  @media (max-width: 860px), (orientation: portrait) and (max-width: 1100px) {
    body { grid-template-columns: 100%; grid-template-rows: 100%; }

    /* The canvas runs FULL BLEED behind the sheet on purpose: the glass
       buttons refract whatever is behind them, so the terrarium has to be
       there to bend. The bugs are fenced above the sheet in the scene
       (scene.insetBottom), so nothing playable ever hides under it. */
    #stage {
      grid-column: 1; grid-row: 1;
      padding: var(--safe-t) var(--safe-r) 0 var(--safe-l);
    }

    aside {
      grid-column: 1; grid-row: 1;
      align-self: end;
      width: 100%;
      max-height: var(--sheet);
      border-left: none;
      border-top: 1px solid var(--line);
      border-radius: 14px 14px 0 0;
      background: rgba(22, 19, 15, 0.86);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      backdrop-filter: blur(20px) saturate(1.2);
      box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.5);
      padding: 0 12px calc(16px + var(--safe-b));
      transition: max-height .28s cubic-bezier(.4, 0, .2, 1);
      display: flex; flex-direction: column;
    }
    body.sheet-collapsed aside { max-height: calc(54px + var(--safe-b)); }
    :root, body { --sheet-now: var(--sheet); }
    body.sheet-collapsed { --sheet-now: calc(54px + var(--safe-b)); }
    #sheetBody { transition: opacity .2s ease; }
    body.sheet-collapsed #sheetBody { opacity: 0; pointer-events: none; }

    /* grab bar + always-visible summary */
    #handle {
      display: block; flex: 0 0 auto;
      margin: 0 -12px; padding: 8px 12px 6px;
      background: transparent; border: none; width: calc(100% + 24px);
      min-height: 0; border-radius: 14px 14px 0 0;
      position: sticky; top: 0; z-index: 2;
    }
    #handle::before {
      content: ''; display: block; width: 40px; height: 4px; margin: 0 auto 8px;
      border-radius: 2px; background: #4a4136;
    }
    #handleRow {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; font-size: 12px; color: var(--muted);
    }
    #handleRow b { color: var(--ink); }
    #chev { color: var(--muted); transition: transform .28s; font-size: 11px; }
    body.sheet-collapsed #chev { transform: rotate(180deg); }

    #sheetBody {
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain; flex: 1 1 auto; min-height: 0;
      padding-top: 4px;
    }
    body.sheet-collapsed #sheetBody { overflow: hidden; }

    h1 { display: none; }
    .lede { display: none; }
    .block { padding: 9px; margin-bottom: 9px; }
    .btns button { flex: 1 1 30%; }
    .genes { max-height: 116px; overflow-y: auto; }
  }

  /* very short landscape phones — trade the sheet for a slim rail */
  @media (max-height: 430px) and (orientation: landscape) {
    body { grid-template-columns: minmax(0,1fr) 268px; }
    /* Back to two real columns — the narrow rules above stacked both children
       into column 1, which in a rail layout means the panel covers the canvas. */
    #stage { grid-column: 1; grid-row: 1; padding-bottom: 0; }
    body.sheet-collapsed #stage { padding-bottom: 0; }
    aside {
      grid-column: 2; grid-row: 1;
      align-self: stretch; max-height: none;
      position: static; border-radius: 0;
      border-top: none; border-left: 1px solid var(--line);
      background: rgba(22, 19, 15, .74); box-shadow: none;
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
      backdrop-filter: blur(18px) saturate(1.15);
      padding: calc(10px + var(--safe-t)) 10px calc(20px + var(--safe-b));
      overflow-y: auto;
    }
    body.sheet-collapsed aside { max-height: none; }
    #handle { display: none; }
    #sheetBody { overflow: visible; opacity: 1; pointer-events: auto; }
    body.sheet-collapsed #sheetBody { opacity: 1; pointer-events: auto; }
    h1 { display: block; font-size: 13px; margin-bottom: 8px; }
    .lede { display: none; }
    /* 268px is tight — stack the stat pairs and shrink the buttons so
       "02:05 AM" and "Fast-fwd" stop wrapping onto a second line. */
    .stat-grid { grid-template-columns: 1fr; gap: 2px 8px; font-size: 12px; }
    .block { padding: 8px; margin-bottom: 8px; }
    .btns button { font-size: 12px; padding: 8px 6px; min-height: 38px; }
    /* short landscape: the dock floats over the canvas, panel is beside it */
    body { --sheet-now: 8px; }
    #dock { gap: 10px; }
    .glass-btn { --d: 46px; }
    .glass-btn svg { width: 17px; height: 17px; }
    .glass-btn span { font-size: 9px; top: calc(100% + 3px); }
    #ffN { width: 52px; }
    label { font-size: 11px; margin-top: 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    aside, #chev, #stage { transition: none; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="canvasHost"></div>
      <div class="dial" id="dock">
          <button id="breed" class="glass-btn" aria-label="Breed one generation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v3a4 4 0 0 0 4 4 4 4 0 0 1 4 4v7M16 3v3a4 4 0 0 1-4 4 4 4 0 0 0-4 4v7"/><path d="M9 7h6M9 17h6"/></svg>
            <span>Breed</span>
          </button>
          <button id="ff" class="glass-btn" aria-label="Fast-forward generations">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 5 8 7-8 7zM13 5l8 7-8 7z"/></svg>
            <span>Fast-fwd</span>
          </button>
          <button id="reseed" class="glass-btn" aria-label="New random population">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3v5h-5"/></svg>
            <span>Reseed</span>
          </button>
          <button id="pause" class="glass-btn" aria-label="Pause simulation" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
            <span>Pause</span>
          </button>
        </div>
    </div>

  <aside>
    <button id="handle" aria-label="Toggle control panel" aria-expanded="true">
      <span id="handleRow">
        <span><b id="hClock">--:--</b> <span id="hPhase">—</span></span>
        <span>gen <b id="hGen">0</b> · <b id="hAlive">0/0</b></span>
        <span id="chev">▼</span>
      </span>
    </button>

    <div id="sheetBody">
      <h1>Terrarium</h1>
      <p class="muted small lede">genes → stats → physics. Stats never read back from the sim.</p>

      <div class="block">
        <div class="stat-grid">
          <div><span>clock</span><b id="clock">--:--</b></div>
          <div><span>phase</span><b id="phase">—</b></div>
          <div><span>gen</span><b id="gen">0</b></div>
          <div><span>alive</span><b id="alive">0/0</b></div>
          <div><span>best fit</span><b id="bestFit">0</b></div>
          <div><span>mean fit</span><b id="meanFit">0</b></div>
          <div><span>seed</span><b id="seedOut">—</b></div>
        </div>
        <div id="sun"></div>
      </div>

      <div class="block">
        <label class="ffn-row">generations
          <input id="ffN" type="number" value="10" min="1" max="500"
                 inputmode="numeric" pattern="[0-9]*"></label>
        <label>fitness <select id="preset"></select></label>
        <label>population <input id="pop" type="range" min="4" max="30" value="12">
          <b id="popOut">12</b></label>
        <label>time scale <input id="tscale" type="range" min="1" max="400" value="1">
          <b id="tscaleOut">real</b></label>
      </div>

      <div class="block" id="inspect"><p class="muted">Tap a bug.</p></div>
    </div>
  </aside>

  <script src="./vendor/phaser.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
