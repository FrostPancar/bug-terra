<!DOCTYPE html><html><head><meta charset="utf-8"><title>Hero</title>
<style>body{background:#4a4f55;margin:0;padding:0;display:grid;
grid-template-columns:repeat(3,1fr);width:1230px}
canvas{width:410px;height:410px;display:block}</style></head><body><script type="module">
import { ARCHETYPES, genomeFromArchetype, seededPopulation } from './src/core/archetypes.js';
import { makeRng } from './src/core/rng.js';
import { drawBug } from './src/render/bugArt.js';
const rng = makeRng(11);
const byKey = {};
for (const a of ARCHETYPES) byKey[a.key] = genomeFromArchetype(a, rng);
const wild = seededPopulation(8, makeRng(2026), { wildcards: 1 });
for (const g of [byKey.beetle, byKey.roach, byKey.centipede, byKey.moth, wild[5], byKey.mantis]) {
  const c = document.createElement('canvas');
  c.width = 820; c.height = 820;
  const ctx = c.getContext('2d');
  ctx.translate(410, 410);
  drawBug(ctx, g, { phase: 0.15, state: 'walk', ppu: 128 });
  document.body.appendChild(c);
}
document.title = 'ready';
</script></body></html>
