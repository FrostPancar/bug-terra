<!DOCTYPE html><html><head><meta charset="utf-8"><title>Archetypes</title>
<style>body{background:#141019;margin:0;padding:14px;display:flex;flex-wrap:wrap;
justify-content:center;font:12px ui-monospace,Menlo,monospace;color:#ece3d4}
figure{width:150px;margin:0;text-align:center;padding:6px 0}
canvas{width:134px;height:134px}figcaption{margin-top:2px;letter-spacing:.04em}</style>
</head><body><script type="module">
import { ARCHETYPES, genomeFromArchetype } from './src/core/archetypes.js';
import { makeRng } from './src/core/rng.js';
import { drawBug } from './src/render/bugArt.js';
const rng = makeRng(11);
for (const a of ARCHETYPES) {
  const g = genomeFromArchetype(a, rng);
  const f = document.createElement('figure');
  const c = document.createElement('canvas');
  c.width = 268; c.height = 268;
  const ctx = c.getContext('2d');
  ctx.translate(134, 134);
  drawBug(ctx, g, { phase: 0.2, state: 'walk', ppu: 40 });
  const cap = document.createElement('figcaption');
  cap.textContent = a.name;
  f.append(c, cap);
  document.body.appendChild(f);
}
document.title = 'ready';
</script></body></html>
