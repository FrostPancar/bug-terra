# Netlify config for repo-based deploys.
#
# The site is a static folder — no build step, no functions, no env vars.
# `deploy/` is the assembled output:
#   /          self-contained build (Phaser inlined, zero external requests)
#   /dev.html  ES-module version reading /src/*, Phaser from /vendor
#
# Regenerate deploy/ after changing src/ with:  npm run build && npm run stage

[build]
  publish = "deploy"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/src/*"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
